<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pagina 4</title>
    <link rel="stylesheet" href="../css/estilo_pag4.css">
</head>
<body>
    <section>
        <div class="contenedor">
            <h2 class="titulo">CONVERSOR DE BASES</h2>
            <label class="etiqueta">Base origen:</label>
            <input type="number" id="rvBaseOrigen" class="campo" placeholder="Ej: 10" min="2" max="36">
            <label class="etiqueta">Número:</label>
            <input type="text" id="rvNumero" class="campo" placeholder="Ej: 255">
            <label class="etiqueta">Base destino:</label>
            <input type="number" id="rvBaseDestino" class="campo" placeholder="Ej: 2" min="2" max="36">
            <button id="rvBtnCalc" class="btn">CALC</button>
            <label class="etiqueta">Resultado:</label>
            <input type="text" id="rvResultado" class="campo resultado" readonly placeholder="Resultado">
        </div>
    </section>
    <script src="../js/java2.js"></script>
</body>
</html>
