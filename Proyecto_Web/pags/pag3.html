<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pagina 3</title>
    <link rel="stylesheet" href="../css/estilo_pag3.css">
</head>
<body>
    <section>
        <div class="contenedor">
            <h1 class="titulo">FORMULARIO</h1>
            <h2 class="subtitulo">Crear cuenta nueva</h2>
            <form id="rvMiFormulario">
                <div class="fila">
                    <input type="text" id="rvNombre" placeholder="Nombre" class="campo">
                    <input type="text" id="rvApellido" placeholder="Apellido" class="campo">
                </div>
                <input type="email" id="rvCorreo" placeholder="Correo electrónico" class="campo completo">
                <input type="password" id="rvContrasena" placeholder="Contraseña nueva" class="campo completo">
                <label class="etiqueta">Fecha de nacimiento</label>
                <input type="date" id="rvFecha" class="campo completo">
                <div id="rvMensaje" class="mensaje"></div>
                <button type="submit" class="btn-registro">Registrarte</button>
            </form>
        </div>
    </section>
    <script src="../js/java1.js"></script>
</body>
</html>
